services:
  - type: web
    name: rutanorte-api
    runtime: docker
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rutanorte-db
          property: connectionString
      - key: UMBRAL_ALTO_VALOR
        value: "100000"
      - key: EVIDENCIAS_DIR
        value: /tmp/evidencias
databases:
  - name: rutanorte-db
    plan: free
